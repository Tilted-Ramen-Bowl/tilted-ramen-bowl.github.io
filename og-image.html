<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; }
    body {
      width: 1200px; height: 630px; overflow: hidden; position: relative;
      background: #0e1826; color: #f4efe6;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .bg {
      position: absolute; inset: 0;
      background:
        radial-gradient(40% 62% at 24% 52%, rgba(243, 168, 58, 0.34), transparent 66%),
        radial-gradient(26% 40% at 24% 52%, rgba(255, 199, 107, 0.18), transparent 60%),
        linear-gradient(180deg, #0e1826 0%, #152238 100%);
    }
    .ledger {
      position: absolute; inset: 0;
      background-image:
        repeating-linear-gradient(180deg, rgba(244, 239, 230, 0.08) 0 1px, transparent 1px 30px),
        linear-gradient(90deg, transparent 0 118px, rgba(243, 168, 58, 0.22) 118px 119px, transparent 119px);
      -webkit-mask-image: radial-gradient(46% 72% at 24% 52%, #000 0%, rgba(0,0,0,0.6) 45%, transparent 72%);
              mask-image: radial-gradient(46% 72% at 24% 52%, #000 0%, rgba(0,0,0,0.6) 45%, transparent 72%);
    }
    .trail {
      position: absolute; inset: 0; width: 1200px; height: 630px;
      -webkit-mask-image: radial-gradient(46% 72% at 24% 52%, #000 0%, rgba(0,0,0,0.6) 45%, transparent 72%);
              mask-image: radial-gradient(46% 72% at 24% 52%, #000 0%, rgba(0,0,0,0.6) 45%, transparent 72%);
    }
    .lantern { position: absolute; left: 44px; top: 62px; width: 460px; height: 506px; }
    .copy { position: absolute; left: 560px; top: 96px; width: 590px; }
    .eyebrow {
      font-size: 19px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
      color: #f3a83a; margin: 0 0 20px;
    }
    .brand {
      font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 74px; line-height: 1;
      letter-spacing: -0.015em; color: #fff; margin: 0 0 22px;
    }
    .brand span { color: #f3a83a; }
    .tag {
      font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 38px; line-height: 1.15;
      color: #f4efe6; margin: 0 0 40px; letter-spacing: -0.01em;
    }
    .person { display: flex; align-items: center; gap: 22px; }
    .person img {
      width: 108px; height: 108px; border-radius: 50%; object-fit: cover; flex: none;
      box-shadow: 0 0 0 4px #0e1826, 0 0 0 6px rgba(243, 168, 58, 0.75), 0 0 44px rgba(243, 168, 58, 0.35);
    }
    .person .name { font-size: 27px; font-weight: 600; color: #fff; line-height: 1.2; }
    .person .role { font-size: 18px; color: #a9b4c6; margin-top: 6px; line-height: 1.35; }
    .url {
      position: absolute; right: 60px; bottom: 40px;
      font-size: 22px; font-weight: 600; color: #ffc76b; letter-spacing: 0.02em;
      display: flex; align-items: center; gap: 10px;
    }
    .url::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #f3a83a; }
  </style>
</head>
